<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recherche – SuperHéros</title>
    <meta name="description" content="Recherchez un super-héros par son nom et consultez ses statistiques de pouvoir.">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/vue@3.5.44/dist/vue.global.prod.js" integrity="sha384-tORx0bXmMnTC28EYQe1coaGZKSQupXQEYDBNex8xkzJ9iqUoNy9Y+VFBhVxi4kUr" crossorigin="anonymous"></script>
    <script defer src="js/superheros.js"></script>
    <script defer src="js/pages/recherche.js"></script>
  </head>
  <body>
    <div id="app" v-cloak>
      <site-nav></site-nav>

      <main class="container py-4">
        <h1 class="mb-2">Recherche de super-héros</h1>
        <p class="page-intro text-body-secondary">
          Tapez le nom d'un personnage ou son nom civil, puis cliquez sur un résultat pour voir sa fiche.
        </p>

        <form class="row g-2 align-items-end mb-3" role="search" @submit.prevent>
          <div class="col-md-7">
            <label class="form-label" for="recherche">Nom du personnage</label>
            <input id="recherche" v-model="query" type="search" class="form-control form-control-lg"
                   placeholder="Batman, Bruce Wayne, Storm…" autocomplete="off" autofocus>
          </div>
          <div class="col-auto">
            <button type="button" class="btn btn-outline-secondary btn-lg" :disabled="!query" @click="query = ''">Effacer</button>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input id="afficher-stats" v-model="showStats" class="form-check-input" type="checkbox">
              <label class="form-check-label" for="afficher-stats">Afficher les statistiques</label>
            </div>
          </div>
        </form>

        <load-status :loading="loading" :error="error" @retry="load"></load-status>

        <template v-if="!loading && !error">
          <p v-if="!query.trim()" class="text-body-secondary">
            {{ heroes.length }} personnages disponibles. Commencez à taper pour lancer la recherche.
          </p>
          <p v-else-if="results.length === 0" class="alert alert-light">
            Aucun personnage ne correspond à « {{ query }} ».
          </p>
          <template v-else>
            <p class="text-body-secondary" aria-live="polite">
              {{ results.length }} résultat{{ results.length > 1 ? 's' : '' }}
            </p>
            <div class="list-group">
              <hero-item v-for="hero in results" :key="hero.id" :hero="hero" :show-stats="showStats"></hero-item>
            </div>
          </template>
        </template>
      </main>

      <site-footer></site-footer>
    </div>
  </body>
</html>
