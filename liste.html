<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tous les personnages – SuperHéros</title>
    <meta name="description" content="Liste des 563 personnages de l'API, filtrable par éditeur et par camp.">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/vue@3.5.44/dist/vue.global.prod.js" integrity="sha384-tORx0bXmMnTC28EYQe1coaGZKSQupXQEYDBNex8xkzJ9iqUoNy9Y+VFBhVxi4kUr" crossorigin="anonymous"></script>
    <script defer src="js/superheros.js"></script>
    <script defer src="js/pages/liste.js"></script>
  </head>
  <body>
    <div id="app" v-cloak>
      <site-nav></site-nav>

      <main class="container py-4">
        <h1 class="mb-2">Tous les personnages</h1>
        <p class="page-intro text-body-secondary">Filtrez par éditeur ou par camp, et triez par nom ou par puissance totale.</p>

        <load-status :loading="loading" :error="error" @retry="load"></load-status>

        <template v-if="!loading && !error">
          <form class="row g-3 align-items-end mb-3" @submit.prevent>
            <div class="col-sm-6 col-lg-4">
              <label class="form-label" for="editeur">Éditeur</label>
              <select id="editeur" v-model="publisher" class="form-select">
                <option value="">Tous les éditeurs</option>
                <option v-for="p in publisherList" :key="p.name" :value="p.name">{{ p.name }} ({{ p.count }})</option>
              </select>
            </div>
            <div class="col-sm-6 col-lg-3">
              <label class="form-label" for="camp">Camp</label>
              <select id="camp" v-model="alignment" class="form-select">
                <option value="">Tous</option>
                <option value="good">Héros</option>
                <option value="bad">Méchants</option>
                <option value="neutral">Neutres</option>
              </select>
            </div>
            <div class="col-sm-6 col-lg-3">
              <label class="form-label" for="tri">Trier par</label>
              <select id="tri" v-model="sort" class="form-select">
                <option value="name">Nom</option>
                <option value="power">Puissance totale</option>
              </select>
            </div>
            <div class="col-sm-6 col-lg-2">
              <div class="form-check mb-2">
                <input id="afficher-stats" v-model="showStats" class="form-check-input" type="checkbox">
                <label class="form-check-label" for="afficher-stats">Statistiques</label>
              </div>
            </div>
          </form>

          <p class="text-body-secondary" aria-live="polite">
            {{ filtered.length }} personnage{{ filtered.length > 1 ? 's' : '' }}
          </p>
          <div class="list-group">
            <hero-item v-for="hero in visible" :key="hero.id" :hero="hero" :show-stats="showStats"></hero-item>
          </div>
          <div v-if="visible.length < filtered.length" class="text-center mt-3">
            <button type="button" class="btn btn-outline-primary" @click="limit += step">
              Afficher {{ Math.min(step, filtered.length - visible.length) }} de plus
            </button>
          </div>
        </template>
      </main>

      <site-footer></site-footer>
    </div>
  </body>
</html>
