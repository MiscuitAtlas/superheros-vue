<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SuperPower Matcher – SuperHéros</title>
    <meta name="description" content="Trouvez les personnages qui atteignent les niveaux de pouvoir choisis.">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/vue@3.5.44/dist/vue.global.prod.js" integrity="sha384-tORx0bXmMnTC28EYQe1coaGZKSQupXQEYDBNex8xkzJ9iqUoNy9Y+VFBhVxi4kUr" crossorigin="anonymous"></script>
    <script defer src="js/superheros.js"></script>
    <script defer src="js/pages/matcher.js"></script>
  </head>
  <body>
    <div id="app" v-cloak>
      <site-nav></site-nav>

      <main class="container py-4">
        <h1 class="mb-2">SuperPower Matcher</h1>
        <p class="page-intro text-body-secondary">
          Réglez le niveau minimum de chaque statistique : les personnages qui les atteignent toutes s'affichent,
          du plus puissant au moins puissant. Un curseur à 0 ne filtre pas.
        </p>

        <load-status :loading="loading" :error="error" @retry="load"></load-status>

        <template v-if="!loading && !error">
          <form class="row g-3 mb-4" @submit.prevent>
            <div v-for="stat in stats" :key="stat.key" class="col-sm-6 col-lg-4">
              <label class="form-label d-flex justify-content-between" :for="'min-' + stat.key">
                <span>{{ stat.label }}</span>
                <span class="matcher-value fw-semibold">{{ minimums[stat.key] }}</span>
              </label>
              <input :id="'min-' + stat.key" v-model.number="minimums[stat.key]" type="range"
                     class="form-range" min="0" max="100" step="5">
            </div>
            <div class="col-12">
              <button type="button" class="btn btn-outline-secondary" :disabled="!active" @click="reset">Remettre à zéro</button>
            </div>
          </form>

          <p v-if="!active" class="text-body-secondary">Déplacez au moins un curseur pour lancer la recherche.</p>
          <p v-else-if="matches.length === 0" class="alert alert-light">
            Aucun personnage n'atteint tous ces niveaux. Baissez un ou plusieurs curseurs.
          </p>
          <template v-else>
            <p class="text-body-secondary" aria-live="polite">
              {{ matches.length }} personnage{{ matches.length > 1 ? 's' : '' }} sur {{ heroes.length }}
            </p>
            <div class="list-group">
              <hero-item v-for="hero in matches.slice(0, 50)" :key="hero.id" :hero="hero" show-stats></hero-item>
            </div>
            <p v-if="matches.length > 50" class="text-body-secondary mt-2">
              Seuls les 50 plus puissants sont affichés : montez un curseur pour affiner.
            </p>
          </template>
        </template>
      </main>

      <site-footer></site-footer>
    </div>
  </body>
</html>
